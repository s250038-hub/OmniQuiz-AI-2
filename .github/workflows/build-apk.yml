name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write   # allow committing the APK back to the repo

jobs:
  build-apk:
    name: Build and commit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create download directory
        run: mkdir -p download/APK

      - name: Copy APK to download folder
        run: cp android/app/build/outputs/apk/debug/app-debug.apk download/APK/app.apk

      - name: Commit APK to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update APK [skip ci]"
          file_pattern: "download/APK/app.apk"
          branch: main

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: omniquiz-apk
          path: download/APK/app.apk
