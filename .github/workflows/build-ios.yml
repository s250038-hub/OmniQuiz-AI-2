name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add iOS platform (skip if exists)
        run: |
          if [ -d "ios/App" ]; then
            echo "iOS platform already exists, skipping cap add"
          else
            npx cap add ios
          fi

      - name: Sync web assets
        run: npx cap sync ios

      - name: Verify iOS project structure
        run: |
          echo "=== Verifying iOS project structure ==="
          if [ ! -d "ios/App" ]; then
            echo "❌ ios/App directory does not exist"
            exit 1
          fi
          # NOTE: .xcworkspace / .xcodeproj are DIRECTORIES on macOS, not files!
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "✓ Found App.xcworkspace"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            echo "✓ Found App.xcodeproj"
          else
            echo "❌ No iOS project bundle found"
            ls -la ios/App/
            exit 1
          fi

      - name: Build iOS app
        run: |
          cd ios/App
          echo "=== Building iOS app for simulator ==="
          if [ -d "App.xcworkspace" ]; then
            echo "Using workspace: App.xcworkspace"
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "Using project: App.xcodeproj"
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi
          echo "✓ Build completed"

      - name: Find and package app bundle
        run: |
          echo "=== Searching for .app bundle ==="
          APP_PATH=$(find ios -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d 2>/dev/null | head -1)
          fi
          if [ -n "$APP_PATH" ]; then
            echo "✓ Found app at: $APP_PATH"
            mkdir -p download/ios
            cp -r "$APP_PATH" download/ios/App.app
            cd download/ios
            zip -rq app.app.zip App.app
            rm -rf App.app
            echo "✓ Created app.app.zip"
            ls -lh app.app.zip
          else
            echo "❌ App bundle not found"
            exit 1
          fi

      - name: Pull latest changes to avoid conflicts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Pull any changes made by the Android workflow while we were building
          git pull --rebase --autostash origin main || echo "Nothing to pull or rebase failed, continuing..."

      - name: Commit iOS app to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update iOS app [skip ci]"
          file_pattern: "download/ios/app.app.zip"
          branch: main
          # Force-with-lease is safe here because we only touch the download/ios folder
          push_options: '--force-with-lease'
