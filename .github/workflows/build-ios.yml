name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets
        run: npx cap sync ios

      - name: Verify iOS project exists
        run: |
          echo "=== Checking iOS project structure ==="
          if [ ! -d "ios/App" ]; then
            echo "❌ ERROR: ios/App directory does not exist"
            exit 1
          fi
          if [ ! -f "ios/App/App.xcworkspace" ]; then
            echo "❌ ERROR: App.xcworkspace not found"
            exit 1
          fi
          echo "✓ iOS project structure verified"

      - name: Build iOS app (generic simulator)
        run: |
          cd ios/App
          
          echo "=== Building for iOS Simulator (generic) ==="
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee ../build.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Build exit code: $BUILD_EXIT_CODE ==="
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code $BUILD_EXIT_CODE"
            echo ""
            echo "=== Last 100 lines of build log ==="
            tail -100 ../build.log
            exit 1
          fi
          
          echo "✓ Build completed successfully"

      - name: Find and package app bundle
        run: |
          echo "=== Searching for .app bundle ==="
          
          # Search in the build directory we specified
          APP_PATH=$(find ios/App/build -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Searching entire ios directory..."
            APP_PATH=$(find ios -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "✓ Found app at: $APP_PATH"
            
            mkdir -p download/ios
            cp -r "$APP_PATH" download/ios/App.app
            
            cd download/ios
            zip -r app.app.zip App.app
            rm -rf App.app
            
            echo "✓ Successfully created app.app.zip"
            ls -lh app.app.zip
          else
            echo "❌ App bundle not found"
            echo ""
            echo "=== Searching for any build artifacts ==="
            find ios -type d -name "Build" 2>/dev/null
            find ios -type d -name "Products" 2>/dev/null
            find ios -type d -name "Debug-*" 2>/dev/null
            
            echo ""
            echo "=== Directory structure ==="
            find ios/App -maxdepth 3 -type d 2>/dev/null
            
            exit 1
          fi

      - name: Commit iOS app to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update iOS app [skip ci]"
          file_pattern: "download/ios/app.app.zip"
          branch: main
