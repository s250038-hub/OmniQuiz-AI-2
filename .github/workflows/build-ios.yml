name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor dependencies
        run: |
          npm install
          echo "=== Installed packages ==="
          npm list --depth=0

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo "=== Web assets ==="
          ls -la www/

      - name: Check Capacitor config
        run: |
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json

      - name: Add iOS platform with verbose output
        run: |
          echo "=== Adding iOS platform ==="
          npx cap add ios
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          
          echo ""
          echo "=== Contents of ios directory ==="
          if [ -d "ios" ]; then
            find ios -maxdepth 3 -type f -o -type d | head -50
          else
            echo "❌ ios directory was not created"
          fi

      - name: Sync web assets
        run: |
          echo "=== Syncing web assets ==="
          npx cap sync ios
          echo "Exit code: $?"

      - name: Check iOS project structure
        run: |
          echo "=== Checking ios/App directory ==="
          if [ -d "ios/App" ]; then
            ls -la ios/App/
          else
            echo "❌ ios/App does not exist"
          fi
          
          echo ""
          echo "=== Searching for workspace/project files ==="
          find ios -name "*.xcworkspace" 2>/dev/null || echo "No .xcworkspace found"
          find ios -name "*.xcodeproj" 2>/dev/null || echo "No .xcodeproj found"
          find ios -name "Podfile" 2>/dev/null || echo "No Podfile found"

      - name: Stop if no iOS project
        run: |
          if [ ! -f "ios/App/App.xcworkspace" ] && [ ! -f "ios/App/App.xcodeproj" ]; then
            echo "❌ No iOS project files found. Cannot continue."
            exit 1
          fi

      - name: Build iOS app
        run: |
          cd ios/App
          
          # Try workspace first, then project
          if [ -f "App.xcworkspace" ]; then
            echo "Using workspace"
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "Using project"
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Find and package app bundle
        run: |
          APP_PATH=$(find ios -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -n "$APP_PATH" ]; then
            echo "✓ Found app at: $APP_PATH"
            mkdir -p download/ios
            cp -r "$APP_PATH" download/ios/App.app
            cd download/ios
            zip -r app.app.zip App.app
            rm -rf App.app
            echo "✓ Successfully created app.app.zip"
          else
            echo "❌ App bundle not found"
            exit 1
          fi

      - name: Commit iOS app to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update iOS app [skip ci]"
          file_pattern: "download/ios/app.app.zip"
          branch: main
