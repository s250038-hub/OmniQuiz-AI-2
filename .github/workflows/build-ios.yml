name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Clean up any existing iOS platform
        run: |
          echo "=== Cleaning up existing iOS platform ==="
          if [ -d "ios" ]; then
            echo "Removing existing ios directory..."
            rm -rf ios
            echo "✓ Removed"
          else
            echo "No existing ios directory found"
          fi

      - name: Add iOS platform
        run: |
          echo "=== Adding iOS platform ==="
          npx cap add ios
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Failed to add iOS platform (exit code: $EXIT_CODE)"
            exit 1
          fi
          
          echo "✓ iOS platform added successfully"
          echo ""
          echo "=== iOS directory structure ==="
          find ios -maxdepth 3 -type f -o -type d | head -50

      - name: Sync web assets
        run: |
          echo "=== Syncing web assets ==="
          npx cap sync ios
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Failed to sync iOS (exit code: $EXIT_CODE)"
            exit 1
          fi
          
          echo "✓ Sync completed successfully"

      - name: Verify iOS project structure
        run: |
          echo "=== Verifying iOS project structure ==="
          
          if [ ! -d "ios/App" ]; then
            echo "❌ ios/App directory does not exist"
            exit 1
          fi
          
          # Check for workspace or project
          if [ -f "ios/App/App.xcworkspace" ]; then
            echo "✓ Found App.xcworkspace"
            PROJECT_TYPE="workspace"
          elif [ -f "ios/App/App.xcodeproj" ]; then
            echo "✓ Found App.xcodeproj"
            PROJECT_TYPE="project"
          else
            echo "❌ No iOS project files found"
            echo ""
            echo "=== Contents of ios/App ==="
            ls -la ios/App/
            exit 1
          fi

      - name: Build iOS app
        run: |
          cd ios/App
          
          echo "=== Building iOS app ==="
          if [ -f "App.xcworkspace" ]; then
            echo "Using workspace: App.xcworkspace"
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "Using project: App.xcodeproj"
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi
          
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed (exit code: $EXIT_CODE)"
            exit 1
          fi
          
          echo "✓ Build completed successfully"

      - name: Find and package app bundle
        run: |
          echo "=== Searching for .app bundle ==="
          APP_PATH=$(find ios -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -n "$APP_PATH" ]; then
            echo "✓ Found app at: $APP_PATH"
            
            mkdir -p download/ios
            cp -r "$APP_PATH" download/ios/App.app
            
            cd download/ios
            zip -r app.app.zip App.app
            rm -rf App.app
            
            echo "✓ Successfully created app.app.zip"
            ls -lh app.app.zip
          else
            echo "❌ App bundle not found"
            echo ""
            echo "=== Searching for build artifacts ==="
            find ios -type d -name "Build" 2>/dev/null
            find ios -type d -name "Products" 2>/dev/null
            find ios -type d -name "Debug-*" 2>/dev/null
            exit 1
          fi

      - name: Commit iOS app to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update iOS app [skip ci]"
          file_pattern: "download/ios/app.app.zip"
          branch: main
